[project]
name = "calendar-bridge"
version = "0.2.0"
description = "Home Assistant custom integration: create calendar events with real reminders (VALARM/RRULE) via Google Calendar and CalDAV, plus optional HA-native notification reminders."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.13"

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.13"
strict = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = "caldav.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "recurring_ical_events.*"
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
