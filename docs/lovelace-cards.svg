<svg viewBox="0 0 920 700" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <style>
      .card { fill: #ffffff; stroke: #e2e2e2; stroke-width: 1; }
      .label { fill: #6b6b6b; font-size: 12px; }
      .field { fill: #ffffff; stroke: #dcdcdc; stroke-width: 1; rx: 8; }
      .placeholder { fill: #9e9e9e; font-size: 13px; }
      .value { fill: #212121; font-size: 13px; }
      .heading { fill: #212121; font-size: 19px; font-weight: 600; }
      .caption { fill: #6b6b6b; font-size: 11px; }
      .btn { fill: #03a9f4; }
      .btn-text { fill: #ffffff; font-size: 14px; font-weight: 600; }
      .chevron { stroke: #6b6b6b; stroke-width: 1.6; fill: none; stroke-linecap: round; stroke-linejoin: round; }
      .arrow { fill: #6b6b6b; }
      .divider { stroke: #ececec; stroke-width: 1; }
    </style>
  </defs>

  <!-- ============ Mobile card ============ -->
  <rect class="card" x="20" y="20" width="380" height="562" rx="12"/>

  <!-- header -->
  <rect x="38" y="30" width="24" height="24" rx="6" fill="#03a9f4"/>
  <path d="M44 42 h12 M50 36 v12" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
  <text class="heading" x="70" y="49">Create event</text>

  <!-- Calendar -->
  <text class="label" x="38" y="90">Calendar</text>
  <rect class="field" x="38" y="96" width="344" height="32" rx="8"/>
  <text class="value" x="50" y="117">Privat</text>
  <path class="arrow" d="M368 108 l6 7 l6 -7 z"/>

  <!-- Title -->
  <text class="label" x="38" y="140">Title</text>
  <rect class="field" x="38" y="146" width="344" height="32" rx="8"/>
  <text class="placeholder" x="50" y="167">e.g. Dentist</text>

  <!-- Date + All day -->
  <text class="label" x="38" y="190">Date</text>
  <rect class="field" x="38" y="196" width="220" height="32" rx="8"/>
  <text class="placeholder" x="50" y="217">dd.mm.yyyy</text>
  <text class="label" x="274" y="190">All day</text>
  <rect x="274" y="200" width="36" height="20" rx="10" fill="#c6c6c6"/>
  <circle cx="284" cy="210" r="8" fill="#ffffff"/>

  <!-- Start -->
  <text class="label" x="38" y="240">Start</text>
  <rect class="field" x="38" y="246" width="344" height="32" rx="8"/>
  <text class="value" x="50" y="267">09:00</text>

  <!-- End -->
  <text class="label" x="38" y="290">End</text>
  <rect class="field" x="38" y="296" width="344" height="32" rx="8"/>
  <text class="value" x="50" y="317">09:30</text>

  <!-- Reminder -->
  <text class="label" x="38" y="340">Reminder</text>
  <rect class="field" x="38" y="346" width="344" height="32" rx="8"/>
  <text class="value" x="50" y="367">30 minutes before</text>
  <path class="arrow" d="M368 358 l6 7 l6 -7 z"/>

  <!-- Recurrence -->
  <text class="label" x="38" y="390">Recurrence</text>
  <rect class="field" x="38" y="396" width="344" height="32" rx="8"/>
  <text class="value" x="50" y="417">None</text>
  <path class="arrow" d="M368 408 l6 7 l6 -7 z"/>

  <!-- More details (collapsed) -->
  <line class="divider" x1="38" y1="440" x2="382" y2="440"/>
  <path class="chevron" d="M40 452 l5 5 l5 -5"/>
  <text class="value" x="58" y="459">More details</text>

  <!-- submit -->
  <rect class="btn" x="38" y="480" width="344" height="42" rx="8"/>
  <text class="btn-text" x="210" y="506" text-anchor="middle">Create event</text>

  <!-- footnote -->
  <circle cx="44" cy="540" r="7" fill="none" stroke="#6b6b6b" stroke-width="1.3"/>
  <text x="44" y="544" text-anchor="middle" font-size="9" fill="#6b6b6b">i</text>
  <text class="caption" x="58" y="544">The reminder is saved in the calendar.</text>

  <!-- ============ Tablet card ============ -->
  <rect class="card" x="420" y="20" width="480" height="630" rx="12"/>

  <rect x="438" y="30" width="24" height="24" rx="6" fill="#03a9f4"/>
  <path d="M444 42 h12 M450 36 v12" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
  <text class="heading" x="470" y="49">Create event</text>

  <!-- Calendar -->
  <text class="label" x="438" y="90">Calendar</text>
  <rect class="field" x="438" y="96" width="444" height="32" rx="8"/>
  <text class="value" x="450" y="117">Privat</text>
  <path class="arrow" d="M868 108 l6 7 l6 -7 z"/>

  <!-- Title -->
  <text class="label" x="438" y="140">Title</text>
  <rect class="field" x="438" y="146" width="444" height="32" rx="8"/>
  <text class="placeholder" x="450" y="167">e.g. Dentist</text>

  <!-- Date + All day -->
  <text class="label" x="438" y="190">Date</text>
  <rect class="field" x="438" y="196" width="280" height="32" rx="8"/>
  <text class="placeholder" x="450" y="217">dd.mm.yyyy</text>
  <text class="label" x="734" y="190">All day</text>
  <rect x="734" y="200" width="36" height="20" rx="10" fill="#c6c6c6"/>
  <circle cx="744" cy="210" r="8" fill="#ffffff"/>

  <!-- Start / End -->
  <text class="label" x="438" y="240">Start</text>
  <rect class="field" x="438" y="246" width="212" height="32" rx="8"/>
  <text class="value" x="450" y="267">09:00</text>
  <text class="label" x="670" y="240">End</text>
  <rect class="field" x="670" y="246" width="212" height="32" rx="8"/>
  <text class="value" x="682" y="267">09:30</text>

  <!-- Reminder / Method -->
  <text class="label" x="438" y="290">Reminder</text>
  <rect class="field" x="438" y="296" width="212" height="32" rx="8"/>
  <text class="value" x="450" y="317">30 minutes before</text>
  <text class="label" x="670" y="290">Method</text>
  <rect class="field" x="670" y="296" width="212" height="32" rx="8"/>
  <text class="value" x="682" y="317">Popup</text>
  <path class="arrow" d="M868 308 l6 7 l6 -7 z"/>

  <!-- Recurrence -->
  <text class="label" x="438" y="340">Recurrence</text>
  <rect class="field" x="438" y="346" width="444" height="32" rx="8"/>
  <text class="value" x="450" y="367">None</text>
  <path class="arrow" d="M868 358 l6 7 l6 -7 z"/>

  <!-- More details (expanded) -->
  <line class="divider" x1="438" y1="390" x2="882" y2="390"/>
  <path class="chevron" d="M440 404 l5 -5 l5 5"/>
  <text class="value" x="458" y="403">More details</text>

  <text class="label" x="438" y="428">Location</text>
  <rect class="field" x="438" y="434" width="444" height="32" rx="8"/>

  <text class="label" x="438" y="482">Description</text>
  <rect class="field" x="438" y="488" width="444" height="52" rx="8"/>

  <!-- submit -->
  <rect class="btn" x="438" y="558" width="444" height="42" rx="8"/>
  <text class="btn-text" x="660" y="584" text-anchor="middle">Create event</text>

  <!-- footnote -->
  <circle cx="444" cy="618" r="7" fill="none" stroke="#6b6b6b" stroke-width="1.3"/>
  <text x="444" y="622" text-anchor="middle" font-size="9" fill="#6b6b6b">i</text>
  <text class="caption" x="458" y="622">The reminder is saved in the calendar.</text>
</svg>
