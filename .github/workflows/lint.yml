name: Lint

on:
  push:
  pull_request:

jobs:
  ruff-mypy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install ruff mypy -r requirements_test.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy --strict custom_components/calendar_bridge
