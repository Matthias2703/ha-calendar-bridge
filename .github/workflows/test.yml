name: Test

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: pip install -r requirements_test.txt
      - run: pip check
      # 95% is the target quality-scale bar (see the project plan's Phase 4), but
      # Phase 1 only has unit tests for the CalDAV backend -- config_flow.py,
      # device.py, services.py etc. get theirs in later phases. Ratchet this up
      # as coverage grows instead of dropping it back to 0.
      - run: pytest --cov=custom_components.calendar_bridge --cov-report=term-missing --cov-fail-under=58
