<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <title>Calendar Bridge</title>

  <!-- Bridge block with an arch cut through it (evenodd hole) -->
  <path fill-rule="evenodd" fill="#0D80E8" d="
    M62,172 L194,172 A12,12 0 0 1 206,184 L206,192 A12,12 0 0 1 194,206
    L62,206 A12,12 0 0 1 50,192 L50,184 A12,12 0 0 1 62,172 Z
    M98,172 A30,30 0 0 0 158,172 Z
  "/>

  <!-- Calendar body -->
  <rect x="50" y="60" width="156" height="112" rx="20" fill="#0D80E8" />

  <!-- Calendar face -->
  <rect x="66" y="84" width="124" height="66" rx="10" fill="#F7F9FB" />

  <!-- Ring tabs -->
  <rect x="79" y="28" width="18" height="48" rx="9" fill="#0D80E8" />
  <rect x="159" y="28" width="18" height="48" rx="9" fill="#0D80E8" />

  <!-- Bell -->
  <g fill="#FF6A1A">
    <circle cx="128" cy="100" r="7" />
    <path d="M98,118 A30,18 0 0 1 158,118 Z" />
    <polygon points="98,120 158,120 168,142 88,142" />
    <rect x="84" y="139" width="88" height="10" rx="5" />
    <path d="M119,155 A9,9 0 0 0 137,155 Z" />
  </g>
</svg>
