rules:
  # Bronze
  action-setup: done
  appropriate-polling: done
  brands: done
  common-modules:
    status: exempt
    comment: |
      No coordinator/base-entity module needed — switch/number read the
      subentry data directly, and the two calendar targets already share
      their common logic via the CalendarTarget protocol in target.py.
  config-flow: done
  config-flow-test-coverage:
    status: done
    comment: |
      tests/test_config_flow_caldav_subentry_errors.py covers the CalDAV
      subentry error paths.
  dependency-transparency: done
  docs-actions: done
  docs-high-level-description: done
  docs-installation-instructions: done
  docs-removal-instructions: done
  entity-event-setup: done
  entity-unique-id: done
  has-entity-name: done
  runtime-data: done
  test-before-configure:
    status: done
    comment: |
      The CalDAV config flow calls discover_calendars() (principal().calendars())
      before creating the entry, failing fast with cannot_connect/invalid_auth.
  test-before-setup:
    status: done
    comment: |
      async_setup_entry calls the target's async_test_connection() before
      completing setup, raising ConfigEntryAuthFailed/ConfigEntryNotReady
      instead of loading against a dead/revoked account.
  unique-config-entry: done

  # Silver
  action-exceptions: done
  config-entry-unloading: done
  docs-configuration-parameters: done
  docs-installation-parameters: done
  entity-unavailable:
    status: exempt
    comment: |
      switch/number entities mirror config data, not a live connection —
      there is no "unavailable" state to represent.
  integration-owner: done
  log-when-unavailable:
    status: done
    comment: |
      The periodic per-calendar poll (A2/R5-07) logs a throttled reachability
      state per calendar: a warning on the first failure (exception or an
      unreachable result), only debug on further consecutive failures, and a
      single info once it recovers. Never logs the calendar URL, only the
      subentry's own display title.
  parallel-updates:
    status: exempt
    comment: |
      Not coordinator-based; each create_event call is independent and
      Home Assistant already serializes service calls to one entity/device.
  reauthentication-flow:
    status: done
    comment: |
      CalDAV's async_step_reauth/async_step_reauth_confirm prompt for a new
      password on a rejected-credentials failure (caldav_target.py's
      _start_reauth); async_setup_entry's own connection check
      (test-before-setup) also starts it via ConfigEntryAuthFailed.
  test-coverage:
    status: todo
    comment: |
      CI coverage gate is 58%, total coverage 87% -- above the gate but
      still short of the Silver target of 95%.

  # Gold (not targeted yet — recorded honestly per the project's own plan)
  devices: done
  diagnostics:
    status: done
    comment: |
      diagnostics.py provides a per-entry download built from an explicit
      allow-list -- the CalDAV password/URL, Google entry id, and any
      calendar identifier are never included in the first place.
  discovery:
    status: exempt
    comment: |
      Connects to a user's existing cloud account (Google/CalDAV) or
      arbitrary CalDAV server — nothing on the network to discover.
  discovery-update-info:
    status: exempt
    comment: |
      Same reasoning as discovery.
  docs-data-update:
    status: exempt
    comment: |
      Service-only integration; there is no data update cycle to document
      beyond the reminder-backfill poller, which is covered under Features.
  docs-examples: done
  docs-known-limitations: done
  docs-supported-devices:
    status: exempt
    comment: |
      Not a device-integration; devices here represent calendars, not
      physical/vendor hardware with a support matrix.
  docs-supported-functions: done
  docs-troubleshooting: done
  docs-use-cases: done
  dynamic-devices: done
  entity-category:
    status: done
    comment: |
      The four configuration controls (reminder/notify switches, reminder/
      notify lead-time numbers) are EntityCategory.CONFIG; the test-notify
      button is EntityCategory.DIAGNOSTIC (an on-demand verification
      action, not a configured value) (R5-08).
  entity-device-class:
    status: exempt
    comment: |
      switch/number are configuration controls, not measurements — no
      applicable device class.
  entity-disabled-by-default:
    status: exempt
    comment: |
      Both entities (reminder switch, reminder minutes) are core controls
      for the integration's purpose, not optional/noisy ones.
  entity-translations: done
  exception-translations:
    status: done
    comment: |
      Every raised HomeAssistantError/ServiceValidationError, including the
      test-notify button's, uses translation_domain/translation_key (R5-09).
  icon-translations: done
  reconfiguration-flow: done
  repair-issues:
    status: done
    comment: |
      The periodic poll raises a "stale_calendar" repair issue once a
      calendar is confirmed gone from the account (see stale-devices) --
      not fixable in-UI, but tells the user which device to remove and why.
  stale-devices:
    status: done
    comment: |
      The periodic poll checks async_calendar_still_exists() once a
      calendar's poll fails, and raises a repair issue (never a silent
      auto-removal, which could destroy user config/history on a false
      positive) once the account itself confirms the calendar is gone --
      as opposed to merely unreachable, which must not be flagged.

  # Platinum
  async-dependency: done
  inject-websession: done
  strict-typing: done
